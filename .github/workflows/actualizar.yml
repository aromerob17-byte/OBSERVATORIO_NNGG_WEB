name: Actualizar observatorio

on:
  schedule:
    - cron: "0 6 * * *"

  push:
    branches:
      - main
    paths:
      - "cuentas.json"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/actualizar.yml"

  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Recoger datos de X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node src/recoger.js

      - name: Procesar datos
        run: node src/procesar.js

      - name: Guardar cambios
        run: |
          git config user.name "Observatorio Bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Actualización automática"
          git push
