name: Actualizar observatorio

on:
  schedule:
    - cron: "0 6 * * *"

  push:
    branches:
      - main
    paths:
      - "cuentas.json"
      - "personas.json"
      - "temas_config.json"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/actualizar.yml"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: observatorio-update
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm ci

      - name: Recoger datos de X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node src/recoger.js

      - name: Procesar datos
        run: node src/procesar.js

      - name: Recoger personas de X
        env:
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: node src/recoger_personas.js

      - name: Procesar personas
        run: node src/procesar_personas.js

      - name: Analizar temas
        run: node src/procesar_temas.js

      - name: Guardar memoria histórica
        run: node src/guardar_historico.js

      - name: Guardar cambios
        run: |
          git config user.name "Observatorio Bot"
          git config user.email "actions@github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Actualización automática"
            git pull --rebase origin main
            git push
          fi

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4

